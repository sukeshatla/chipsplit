# Supabase pauses free projects after about a week with no activity.
# This pings the database every 3 days so a quiet month doesn't take the app offline.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "No Supabase secrets set, skipping"; exit 0; fi
          curl -sf "$URL/rest/v1/groups?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Pinged"
